<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>立体几何三维可视化教学工具 - 明亮版</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Microsoft YaHei', 'Segoe UI', 'PingFang SC', 'Roboto', 'Helvetica Neue', sans-serif;
            background: linear-gradient(180deg, #fff7eb 0%, #f8ead3 100%);
        }

        /* 信息面板 */
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 300px;
            background: rgba(46, 34, 24, 0.92);
            backdrop-filter: blur(18px);
            border-radius: 28px;
            padding: 18px 20px;
            color: #fff8ee;
            border: 1px solid rgba(255, 220, 170, 0.65);
            box-shadow: 0 18px 30px rgba(0,0,0,0.18);
            pointer-events: auto;
            z-index: 20;
            font-size: 15px;
        }
        .info-panel h3 {
            margin: 0 0 12px 0;
            text-align: center;
            font-size: 1.6rem;
            color: #ffd98f;
            font-weight: 700;
        }
        .info-panel .shape-name {
            text-align: center;
            font-size: 1.45rem;
            font-weight: bold;
            margin-bottom: 16px;
            color: #fff3e3;
            background: rgba(0,0,0,0.3);
            border-radius: 999px;
            padding: 8px 14px;
            letter-spacing: 1px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,235,200,0.22);
            padding-bottom: 8px;
            font-size: 1.02rem;
        }
        .info-label {
            font-weight: 600;
            color: #f8e2c1;
        }
        .info-value {
            font-weight: bold;
            font-family: monospace;
            font-size: 1.08rem;
            color: #ffcd85;
        }
        .formula {
            background: rgba(0,0,0,0.35);
            border-radius: 20px;
            padding: 14px 16px;
            margin-top: 16px;
            font-size: 0.95rem;
            border-left: 4px solid #ffb454;
        }
        .formula p {
            margin: 8px 0;
            word-break: break-word;
            line-height: 1.45;
        }
        .formula span {
            font-weight: bold;
            color: #ffe0a6;
        }

        #stage {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 110px;
            z-index: 1;
            display: flex;
            gap: 16px;
        }
        .viewport {
            position: relative;
            min-width: 0;
            flex: 1 1 0;
            border-radius: 24px;
            overflow: hidden;
            background: rgba(255, 251, 244, 0.6);
            box-shadow: inset 0 0 0 1px rgba(255, 220, 170, 0.28), 0 12px 22px rgba(0,0,0,0.12);
        }
        #solidViewport {
            flex: 1 1 0;
        }
        #netViewport {
            flex: 1 1 0;
            display: none;
            z-index: 4;
            border: 1px solid rgba(255, 220, 170, 0.45);
            background: rgba(255, 248, 238, 0.92);
            backdrop-filter: blur(14px);
        }
        #netViewport.visible {
            display: block;
        }
        .viewport-title {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 6;
            background: rgba(36, 28, 22, 0.78);
            color: #fff4e6;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            pointer-events: none;
        }
        .panel-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 50%;
            z-index: 6;
            font-size: 18px;
            line-height: 1;
        }
        .net-hint {
            position: absolute;
            left: 14px;
            top: 52px;
            z-index: 6;
            background: rgba(255, 248, 230, 0.88);
            color: #5a4030;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            pointer-events: none;
        }

        /* 底部控制栏 */
        .controls {
            position: absolute;
            left: 20px;
            right: 20px;
            bottom: 20px;
            background: rgba(36, 28, 22, 0.9);
            backdrop-filter: blur(18px);
            border-radius: 24px;
            padding: 14px 18px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
            border: 1px solid rgba(255, 220, 170, 0.5);
            font-size: 14px;
            color: white;
            box-shadow: 0 10px 22px rgba(0,0,0,0.18);
        }
        button, .shape-select, .slider-container {
            background: #513a2d;
            border: none;
            color: #fff4e6;
            padding: 8px 18px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s ease;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.18);
            font-family: inherit;
        }
        button:hover {
            background: #e09a4a;
            color: #2f1f12;
            transform: translateY(-1px);
        }
        button.active {
            background: #ffb357;
            color: #2c1e12;
        }
        .shape-select {
            background: #2f251f;
            cursor: pointer;
            outline: none;
        }
        .slider-container {
            background: rgba(22, 18, 14, 0.82);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 6px 16px;
        }
        .slider-container label {
            font-weight: 600;
            color: #ffe2b8;
            font-size: 13px;
            white-space: nowrap;
        }
        .slider-container span {
            min-width: 44px;
            text-align: right;
        }
        input[type="range"] {
            width: 150px;
            cursor: pointer;
            background: #ffaa66;
            height: 5px;
            border-radius: 5px;
            -webkit-appearance: none;
        }
        input[type="range"]:focus {
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            background: #ffd899;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 4px rgba(255,170,0,0.6);
        }
        .hud-note {
            font-size: 13px;
            opacity: 0.88;
            white-space: nowrap;
        }
        @media (max-width: 800px) {
            #stage { flex-direction: column; }
            .controls { gap: 10px; padding: 12px 14px; }
            button, .shape-select { padding: 6px 14px; font-size: 13px; }
            .slider-container { padding: 5px 12px; gap: 8px; }
            input[type="range"] { width: 120px; }
            .info-panel { width: 270px; padding: 16px; top: 14px; right: 14px; }
            .info-panel h3 { font-size: 1.35rem; }
            .shape-name { font-size: 1.2rem; }
            .info-row { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="info-panel" id="infoPanel">
        <h3>📐 几何属性</h3>
        <div class="shape-name" id="shapeName">正方体</div>
        <div class="info-row"><span class="info-label">🔺 顶点数:</span><span class="info-value" id="vertexCount">8</span></div>
        <div class="info-row"><span class="info-label">📏 棱数:</span><span class="info-value" id="edgeCount">12</span></div>
        <div class="info-row"><span class="info-label">🔲 面数:</span><span class="info-value" id="faceCount">6</span></div>
        <div class="formula">
            <p>📦 体积公式: <span id="volumeFormula">V = a³</span></p>
            <p>📐 表面积公式: <span id="areaFormula">S = 6a²</span></p>
        </div>
    </div>

    <div id="stage">
        <div class="viewport" id="solidViewport">
            <div class="viewport-title">立体图</div>
        </div>
        <div class="viewport" id="netViewport">
            <div class="viewport-title">展开图</div>
            <button id="closeNetBtn" class="panel-close">×</button>
            <div class="net-hint">🖱️ 滚轮缩放展开图</div>
        </div>
    </div>

    <div class="controls">
        <select id="shapeSelector" class="shape-select">
            <option value="cube">正方体</option>
            <option value="cuboid">长方体</option>
            <option value="sphere">球体</option>
            <option value="cylinder">圆柱体</option>
            <option value="cone">圆锥体</option>
            <option value="tetrahedron">正四面体</option>
        </select>

        <div id="dimensionSliders" style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
            <div class="slider-container" id="sliderX">
                <label>边长/长 (a):</label>
                <input type="range" id="sizeX" min="0.5" max="2.0" step="0.01" value="1.2">
                <span id="sizeXVal" style="min-width: 45px;">1.20</span>
            </div>
            <div class="slider-container" id="sliderY" style="display: none;">
                <label>宽 (b):</label>
                <input type="range" id="sizeY" min="0.5" max="2.0" step="0.01" value="1.0">
                <span id="sizeYVal" style="min-width: 45px;">1.00</span>
            </div>
            <div class="slider-container" id="sliderZ" style="display: none;">
                <label>高 (c):</label>
                <input type="range" id="sizeZ" min="0.5" max="2.0" step="0.01" value="0.8">
                <span id="sizeZVal" style="min-width: 45px;">0.80</span>
            </div>
        </div>

        <button id="toggleAutoRotateBtn">🔄 自动旋转：关</button>
        <button id="togglePauseBtn">⏸️ 暂停：关</button>
        <button id="toggleNetBtn">📄 显示展开图</button>
        <button id="resetViewBtn">↺ 复位视图</button>
        <span class="hud-note">🖱️ 左侧拖拽旋转 | 右侧滚轮缩放</span>
    </div>

    <!-- 引入 Three.js 核心库及扩展 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 初始化场景、相机、渲染器 (背景强制明亮淡米色)---
        const solidScene = new THREE.Scene();
        // 使用明亮的淡奶油色 / 淡米色背景
        solidScene.background = new THREE.Color(0xfef0da);  // #fef0da 暖米白
        solidScene.fog = new THREE.FogExp2(0xfef0da, 0.008);

        const netScene = new THREE.Scene();
        netScene.background = new THREE.Color(0xfef0da);
        netScene.fog = new THREE.FogExp2(0xfef0da, 0.008);

        const solidCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        solidCamera.position.set(3.2, 2.2, 4.2);
        solidCamera.lookAt(0, 0, 0);

        const netCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        netCamera.position.set(0, 0, 8);
        netCamera.lookAt(0, 0, 0);

        const solidRenderer = new THREE.WebGLRenderer({ antialias: true });
        solidRenderer.setSize(1, 1);
        solidRenderer.shadowMap.enabled = true;
        solidRenderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('solidViewport').appendChild(solidRenderer.domElement);

        const netRenderer = new THREE.WebGLRenderer({ antialias: true });
        netRenderer.setSize(1, 1);
        netRenderer.shadowMap.enabled = true;
        netRenderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('netViewport').appendChild(netRenderer.domElement);

        // CSS2渲染文字辅助 (用于展开图)
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(1, 1);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.getElementById('netViewport').appendChild(labelRenderer.domElement);

        const solidViewportEl = document.getElementById('solidViewport');
        const netViewportEl = document.getElementById('netViewport');

        function updateNetViewportVisibility() {
            netViewportEl.classList.toggle('visible', netVisible);
        }

        function resetNetCamera() {
            netZoom = 1;
            netCamera.position.set(0, 0, 8);
            netCamera.lookAt(0, 0, 0);
            netCamera.zoom = netZoom;
            netCamera.updateProjectionMatrix();
        }

        function resizeViewports() {
            const solidRect = solidViewportEl.getBoundingClientRect();
            solidCamera.aspect = solidRect.width / solidRect.height;
            solidCamera.updateProjectionMatrix();
            solidRenderer.setSize(solidRect.width, solidRect.height);

            if (netVisible) {
                const netRect = netViewportEl.getBoundingClientRect();
                netCamera.aspect = netRect.width / netRect.height;
                netCamera.updateProjectionMatrix();
                netRenderer.setSize(netRect.width, netRect.height);
                labelRenderer.setSize(netRect.width, netRect.height);
            }
        }

        const netAmbientLight = new THREE.AmbientLight(0xfcf3e0, 1.0);
        netScene.add(netAmbientLight);
        const controls = new OrbitControls(solidCamera, solidRenderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 1.0;
        controls.zoomSpeed = 1.2;
        controls.panSpeed = 0.8;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.target.set(0, 0, 0);

        solidRenderer.domElement.style.width = '100%';
        solidRenderer.domElement.style.height = '100%';
        solidRenderer.domElement.style.display = 'block';
        netRenderer.domElement.style.width = '100%';
        netRenderer.domElement.style.height = '100%';
        netRenderer.domElement.style.display = 'block';
        labelRenderer.domElement.style.width = '100%';
        labelRenderer.domElement.style.height = '100%';
        
        // --- 辅助元素: 坐标轴 (颜色稍深以适应浅背景) + 网格地面 ---
        const axesHelper = new THREE.AxesHelper(3.0);
        solidScene.add(axesHelper);

        // 网格地面: 浅棕色线条，半透明
        const gridHelper = new THREE.GridHelper(9, 24, 0xc0a070, 0xd8c098);
        gridHelper.position.y = -1.35;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.55;
        solidScene.add(gridHelper);

        // 增强光照系统，使半透明材质柔和明亮
        const ambientLight = new THREE.AmbientLight(0xfcf3e0, 0.9);
        solidScene.add(ambientLight);
        const mainLight = new THREE.DirectionalLight(0xfff5e6, 1.3);
        mainLight.position.set(3, 6, 2);
        mainLight.castShadow = true;
        mainLight.receiveShadow = false;
        solidScene.add(mainLight);
        const fillLight = new THREE.PointLight(0xe6d5b0, 0.7);
        fillLight.position.set(-2, 2.5, 3);
        solidScene.add(fillLight);
        const backFill = new THREE.PointLight(0xdac29c, 0.5);
        backFill.position.set(1, 1.5, -3.2);
        solidScene.add(backFill);
        const rimLight = new THREE.PointLight(0xffc48a, 0.5);
        rimLight.position.set(1.5, 1, 2.8);
        solidScene.add(rimLight);

        // 装饰粒子 (淡金色)
        const particleGeo = new THREE.BufferGeometry();
        const particleCount = 700;
        const particlePos = [];
        for (let i = 0; i < particleCount; i++) {
            particlePos.push((Math.random() - 0.5) * 90);
            particlePos.push((Math.random() - 0.5) * 50);
            particlePos.push((Math.random() - 0.5) * 70 - 30);
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(particlePos), 3));
        const particleMat = new THREE.PointsMaterial({ color: 0xdbb87c, size: 0.07, transparent: true, opacity: 0.45 });
        const stars = new THREE.Points(particleGeo, particleMat);
        solidScene.add(stars);
        
        // --- 全局变量 ---
        let currentMesh = null;
        let currentEdges = null;
        let currentNetGroup = null;
        let netVisible = true;
        let autoRotateEnabled = false;
        let autoRotatePaused = false;
        let currentShapeType = 'cube';
        let netZoom = 1;
        const shapeState = {
            cube: { x: 1.2 },
            cuboid: { x: 1.2, y: 1.0, z: 0.8 },
            sphere: { x: 0.92 },
            cylinder: { x: 0.84, y: 1.48 },
            cone: { x: 0.94, y: 1.68 },
            tetrahedron: { x: 1.1 }
        };
        let params = { ...shapeState.cube };

        // --- UI: 滑块显隐 ---
        function updateSliderVisibility(type) {
            const sliderXDiv = document.getElementById('sliderX');
            const sliderYDiv = document.getElementById('sliderY');
            const sliderZDiv = document.getElementById('sliderZ');
            const xLabel = document.querySelector('#sliderX label');
            const yLabel = document.querySelector('#sliderY label');
            const zLabel = document.querySelector('#sliderZ label');
            const sx = document.getElementById('sizeX');
            const sy = document.getElementById('sizeY');
            const sz = document.getElementById('sizeZ');
            const sxVal = document.getElementById('sizeXVal');
            const syVal = document.getElementById('sizeYVal');
            const szVal = document.getElementById('sizeZVal');
            const state = shapeState[type];

            const applyRange = (input, min, max) => {
                input.min = min;
                input.max = max;
                input.step = '0.01';
            };
            const applyValue = (input, value, output) => {
                input.value = value.toFixed(2);
                output.innerText = value.toFixed(2);
            };

            if (type === 'cube') {
                sliderXDiv.style.display = 'flex';
                sliderYDiv.style.display = 'none';
                sliderZDiv.style.display = 'none';
                if (xLabel) xLabel.innerText = '边长 a:';
                applyRange(sx, 0.5, 2.5);
                applyValue(sx, state.x, sxVal);
            } else if (type === 'cuboid') {
                sliderXDiv.style.display = 'flex';
                sliderYDiv.style.display = 'flex';
                sliderZDiv.style.display = 'flex';
                if (xLabel) xLabel.innerText = '长 a:';
                if (yLabel) yLabel.innerText = '宽 b:';
                if (zLabel) zLabel.innerText = '高 c:';
                applyRange(sx, 0.5, 2.5);
                applyRange(sy, 0.5, 2.5);
                applyRange(sz, 0.5, 2.5);
                applyValue(sx, state.x, sxVal);
                applyValue(sy, state.y, syVal);
                applyValue(sz, state.z, szVal);
            } else if (type === 'sphere') {
                sliderXDiv.style.display = 'flex';
                sliderYDiv.style.display = 'none';
                sliderZDiv.style.display = 'none';
                if (xLabel) xLabel.innerText = '半径 r:';
                applyRange(sx, 0.3, 2.5);
                applyValue(sx, state.x, sxVal);
            } else if (type === 'cylinder') {
                sliderXDiv.style.display = 'flex';
                sliderYDiv.style.display = 'flex';
                sliderZDiv.style.display = 'none';
                if (xLabel) xLabel.innerText = '半径 r:';
                if (yLabel) yLabel.innerText = '高 h:';
                applyRange(sx, 0.3, 2.5);
                applyRange(sy, 0.5, 3.0);
                applyValue(sx, state.x, sxVal);
                applyValue(sy, state.y, syVal);
            } else if (type === 'cone') {
                sliderXDiv.style.display = 'flex';
                sliderYDiv.style.display = 'flex';
                sliderZDiv.style.display = 'none';
                if (xLabel) xLabel.innerText = '半径 r:';
                if (yLabel) yLabel.innerText = '高 h:';
                applyRange(sx, 0.3, 2.5);
                applyRange(sy, 0.5, 3.0);
                applyValue(sx, state.x, sxVal);
                applyValue(sy, state.y, syVal);
            } else if (type === 'tetrahedron') {
                sliderXDiv.style.display = 'flex';
                sliderYDiv.style.display = 'none';
                sliderZDiv.style.display = 'none';
                if (xLabel) xLabel.innerText = '外接半径 R:';
                applyRange(sx, 0.5, 2.5);
                applyValue(sx, state.x, sxVal);
            }

            params = { ...state };
        }
        
        // 创建立方体/长方体 (半透明+边缘高亮)
        function createBoxMesh(w, h, d, color = 0x7c8ebf) {
            const geometry = new THREE.BoxGeometry(w, h, d);
            const material = new THREE.MeshPhongMaterial({
                color: color,
                transparent: true,
                opacity: 0.68,
                side: THREE.DoubleSide,
                emissive: 0x332010,
                specular: 0xeecfa0,
                shininess: 70
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            return mesh;
        }
        
        // 标准几何体 (球/柱/锥/四面体)
        function createStandardMesh(type, shapeParams) {
            let geometry, color = 0x7c9ed9;
            switch(type) {
                case 'sphere':
                    geometry = new THREE.SphereGeometry(shapeParams.x, 80, 80);
                    color = 0x6c9cf0;
                    break;
                case 'cylinder':
                    geometry = new THREE.CylinderGeometry(shapeParams.x, shapeParams.x, shapeParams.y, 64, 48);
                    color = 0x7aaae5;
                    break;
                case 'cone':
                    geometry = new THREE.ConeGeometry(shapeParams.x, shapeParams.y, 64, 48);
                    color = 0x8abaea;
                    break;
                case 'tetrahedron':
                    geometry = new THREE.TetrahedronGeometry(shapeParams.x);
                    color = 0x9acaf5;
                    break;
                default: geometry = new THREE.BoxGeometry(1,1,1);
            }
            const material = new THREE.MeshPhongMaterial({
                color: color,
                transparent: true,
                opacity: 0.72,
                side: THREE.DoubleSide,
                emissive: 0x331d08,
                specular: 0xeecd99,
                shininess: 68
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            return mesh;
        }
        
        // 边缘高亮
        function attachEdges(mesh, color = 0xffcc88) {
            const edgesGeo = new THREE.EdgesGeometry(mesh.geometry);
            const edgesMat = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
            const wireframe = new THREE.LineSegments(edgesGeo, edgesMat);
            mesh.add(wireframe);
            return wireframe;
        }
        
        function removeCurrent() {
            if (currentMesh) {
                solidScene.remove(currentMesh);
                if (currentMesh.geometry) currentMesh.geometry.dispose();
                if (currentMesh.material) currentMesh.material.dispose();
            }
            if (currentEdges) {
                if (currentEdges.parent) currentEdges.parent.remove(currentEdges);
                solidScene.remove(currentEdges);
            }
            if (currentNetGroup) {
                netScene.remove(currentNetGroup);
                if (currentNetGroup.children) {
                    currentNetGroup.children.forEach(child => {
                        if (child.isCSS2DObject && child.element) child.element.remove();
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach(material => material.dispose());
                            } else {
                                child.material.dispose();
                            }
                        }
                    });
                }
            }
        }
        
        // 更新信息面板 (数值和公式)
        function updateInfoPanel(type, w, h, d) {
            let vertices = 0, edges = 0, faces = 0, volFormula = '', areaFormula = '';
            if (type === 'cube') {
                vertices = 8; edges = 12; faces = 6;
                const vol = w*w*w;
                const area = 6*w*w;
                volFormula = `V = a³ = ${w.toFixed(2)}³ = <strong style="color:#ffcc88">${vol.toFixed(3)}</strong>`;
                areaFormula = `S = 6a² = 6 × ${(w*w).toFixed(3)} = <strong style="color:#ffcc88">${area.toFixed(3)}</strong>`;
            } else if (type === 'cuboid') {
                vertices = 8; edges = 12; faces = 6;
                const vol = w*h*d;
                const area = 2*(w*h + w*d + h*d);
                volFormula = `V = a·b·c = ${w.toFixed(2)}×${h.toFixed(2)}×${d.toFixed(2)} = <strong style="color:#ffcc88">${vol.toFixed(3)}</strong>`;
                areaFormula = `S = 2(ab+ac+bc) = <strong style="color:#ffcc88">${area.toFixed(3)}</strong>`;
            } else if (type === 'sphere') {
                vertices = '∞ (连续)'; edges = '—'; faces = '—';
                const r = w;
                const vol = (4/3)*Math.PI*Math.pow(r,3);
                const area = 4*Math.PI*r*r;
                volFormula = `V = (4/3)πr³ ≈ <strong style="color:#ffcc88">${vol.toFixed(3)}</strong> (r=${r.toFixed(2)})`;
                areaFormula = `S = 4πr² ≈ <strong style="color:#ffcc88">${area.toFixed(3)}</strong>`;
            } else if (type === 'cylinder') {
                vertices = '—'; edges = '—'; faces = '—';
                const r = w, height = h;
                const vol = Math.PI*r*r*height;
                const area = 2*Math.PI*r*(r+height);
                volFormula = `V = πr²h ≈ <strong style="color:#ffcc88">${vol.toFixed(3)}</strong> (r=${r.toFixed(2)}, h=${height.toFixed(2)})`;
                areaFormula = `S = 2πr(r+h) ≈ <strong style="color:#ffcc88">${area.toFixed(3)}</strong>`;
            } else if (type === 'cone') {
                vertices = 1; edges = 1; faces = 2;
                const r = w, hVal = h;
                const vol = (1/3)*Math.PI*r*r*hVal;
                const slant = Math.sqrt(r*r + hVal*hVal);
                const area = Math.PI*r*(r+slant);
                volFormula = `V = (1/3)πr²h ≈ <strong style="color:#ffcc88">${vol.toFixed(3)}</strong> (r=${r.toFixed(2)}, h=${hVal.toFixed(2)})`;
                areaFormula = `S = πr(r+√(r²+h²)) ≈ <strong style="color:#ffcc88">${area.toFixed(3)}</strong>`;
            } else if (type === 'tetrahedron') {
                vertices = 4; edges = 6; faces = 4;
                const side = w;
                const vol = Math.pow(side,3) / (6 * Math.sqrt(2));
                const area = Math.sqrt(3) * side * side;
                volFormula = `V = a³/(6√2) ≈ <strong style="color:#ffcc88">${vol.toFixed(3)}</strong> (棱长≈${side.toFixed(2)})`;
                areaFormula = `S = √3 a² ≈ <strong style="color:#ffcc88">${area.toFixed(3)}</strong>`;
            }
            document.getElementById('vertexCount').innerHTML = vertices;
            document.getElementById('edgeCount').innerHTML = edges;
            document.getElementById('faceCount').innerHTML = faces;
            document.getElementById('volumeFormula').innerHTML = volFormula;
            document.getElementById('areaFormula').innerHTML = areaFormula;
            const nameMap = {cube:'正方体',cuboid:'长方体',sphere:'球体',cylinder:'圆柱体',cone:'圆锥体',tetrahedron:'正四面体'};
            document.getElementById('shapeName').innerHTML = nameMap[type];
        }
        
        // 生成展开图 (真正面片)
        function generateNetGroup(type, shapeParams) {
            const group = new THREE.Group();
            const baseX = -0.2;
            const baseY = 0.45;
            const baseZ = 0.6;
            const makeLabel = (text, xOff, yOff, borderColor = 'rgba(185,122,46,0.75)') => {
                const div = document.createElement('div');
                div.textContent = text;
                div.style.color = '#2e241a';
                div.style.fontSize = '14px';
                div.style.fontWeight = 'bold';
                div.style.padding = '4px 10px';
                div.style.borderRadius = '18px';
                div.style.background = 'rgba(255,248,230,0.92)';
                div.style.border = `1px solid ${borderColor}`;
                div.style.whiteSpace = 'nowrap';
                const label = new CSS2DObject(div);
                label.position.set(baseX + xOff, baseY + yOff, baseZ + 0.03);
                group.add(label);
                return label;
            };
            const makeFace = (width, height, color, xOff, yOff) => {
                const geometry = new THREE.PlaneGeometry(width, height);
                const material = new THREE.MeshPhongMaterial({
                    color,
                    transparent: true,
                    opacity: 0.92,
                    side: THREE.DoubleSide,
                    shininess: 55,
                    specular: 0xe7cda2,
                    depthWrite: false
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(baseX + xOff, baseY + yOff, baseZ);
                group.add(mesh);

                const outline = new THREE.LineSegments(
                    new THREE.EdgesGeometry(geometry),
                    new THREE.LineBasicMaterial({ color: 0xb26d22, transparent: true, opacity: 0.85 })
                );
                mesh.add(outline);
                return mesh;
            };

            if (type === 'cube' || type === 'cuboid') {
                const a = type === 'cube' ? shapeParams.x : shapeParams.x;
                const b = type === 'cube' ? shapeParams.x : shapeParams.y;
                const c = type === 'cube' ? shapeParams.x : shapeParams.z;
                const gapAB = 0.02;
                const gapAC = 0.02;
                const gapBC = 0.02;
                const frontBackColor = 0xf3d6ab;
                const sideColor = 0xdcedc9;
                const topBottomColor = 0xe0d8ff;

                // 中心面：前面
                makeFace(a, b, frontBackColor, 0, 0);
                makeLabel(`前面 ${a.toFixed(2)}×${b.toFixed(2)}`, 0, 0);

                // 右面 / 左面
                makeFace(c, b, sideColor, (a + c) / 2 + gapAC, 0);
                makeLabel(`右面 ${c.toFixed(2)}×${b.toFixed(2)}`, (a + c) / 2 + gapAC, 0);
                makeFace(c, b, sideColor, -((a + c) / 2 + gapAC), 0);
                makeLabel(`左面 ${c.toFixed(2)}×${b.toFixed(2)}`, -((a + c) / 2 + gapAC), 0);

                // 上面 / 下面
                makeFace(a, c, topBottomColor, 0, (b + c) / 2 + gapBC);
                makeLabel(`上面 ${a.toFixed(2)}×${c.toFixed(2)}`, 0, (b + c) / 2 + gapBC);
                makeFace(a, c, topBottomColor, 0, -((b + c) / 2 + gapBC));
                makeLabel(`下面 ${a.toFixed(2)}×${c.toFixed(2)}`, 0, -((b + c) / 2 + gapBC));

                // 后面
                makeFace(a, b, frontBackColor, 0, -((b + c) + gapBC * 2));
                makeLabel(`后面 ${a.toFixed(2)}×${b.toFixed(2)}`, 0, -((b + c) + gapBC * 2));

                const title = document.createElement('div');
                title.textContent = '十字展开图';
                title.style.color = '#2e241a';
                title.style.fontSize = '15px';
                title.style.fontWeight = 'bold';
                title.style.padding = '5px 12px';
                title.style.borderRadius = '18px';
                title.style.background = 'rgba(204,170,119,0.92)';
                title.style.border = '1px solid rgba(170,102,51,0.8)';
                const titleLabel = new CSS2DObject(title);
                titleLabel.position.set(baseX, baseY - ((b + c) + 1.0), baseZ + 0.03);
                group.add(titleLabel);
            } else if (type === 'sphere') {
                const addNote = (text, yOff, bg) => {
                    const div = document.createElement('div');
                    div.textContent = text;
                    div.style.background = bg;
                    div.style.color = '#2f3d22';
                    div.style.fontSize = '14px';
                    div.style.fontWeight = 'bold';
                    div.style.padding = '6px 12px';
                    div.style.borderRadius = '18px';
                    div.style.border = '1px solid rgba(85,136,68,0.7)';
                    const label = new CSS2DObject(div);
                    label.position.set(baseX, baseY + yOff, baseZ);
                    group.add(label);
                };
                addNote('球体无法精确展开为平面', 0.7, '#d9ecce');
                addNote('近似: 橘子瓣状分割', -0.15, '#d9ecce');
                addNote('→ 地图投影方式示意', -1.0, '#cce0bb');
            } else if (type === 'cylinder') {
                const radius = shapeParams.x;
                const height = shapeParams.y;
                const sideWidth = 2 * Math.PI * radius;
                const side = new THREE.Mesh(
                    new THREE.PlaneGeometry(sideWidth, height),
                    new THREE.MeshPhongMaterial({ color: 0xe8d7a6, transparent: true, opacity: 0.8, side: THREE.DoubleSide })
                );
                side.position.set(baseX, baseY + 0.15, baseZ);
                group.add(side);

                const top = new THREE.Mesh(
                    new THREE.CircleGeometry(radius, 48),
                    new THREE.MeshPhongMaterial({ color: 0xf4e6bb, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
                );
                top.position.set(baseX - (radius * 2.4), baseY - (height * 0.5 + radius * 1.35), baseZ);
                group.add(top);

                const bottom = new THREE.Mesh(
                    new THREE.CircleGeometry(radius, 48),
                    new THREE.MeshPhongMaterial({ color: 0xf4e6bb, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
                );
                bottom.position.set(baseX + (radius * 2.4), baseY - (height * 0.5 + radius * 1.35), baseZ);
                group.add(bottom);

                const labelText = (text, xOff, yOff) => {
                    const div = document.createElement('div');
                    div.textContent = text;
                    div.style.background = 'rgba(255,248,230,0.9)';
                    div.style.color = '#2e241a';
                    div.style.fontSize = '14px';
                    div.style.fontWeight = 'bold';
                    div.style.padding = '4px 10px';
                    div.style.borderRadius = '18px';
                    div.style.border = '1px solid rgba(138,110,60,0.75)';
                    const label = new CSS2DObject(div);
                    label.position.set(baseX + xOff, baseY + yOff, baseZ + 0.01);
                    group.add(label);
                };
                labelText('圆柱展开图', 0, height * 0.55 + 0.5);
                labelText(`侧面: 矩形 ${sideWidth.toFixed(2)}×${height.toFixed(2)}`, 0, 0.05);
                labelText(`上底 / 下底: 圆 r=${radius.toFixed(2)}`, 0, -(height * 0.5 + radius + 0.45));
            } else if (type === 'cone') {
                const radius = shapeParams.x;
                const height = shapeParams.y;
                const slant = Math.sqrt(radius * radius + height * height);
                const sector = new THREE.Mesh(
                    new THREE.CircleGeometry(slant, 64, 0, Math.PI * 1.6),
                    new THREE.MeshPhongMaterial({ color: 0xf0ddb0, transparent: true, opacity: 0.82, side: THREE.DoubleSide })
                );
                sector.position.set(baseX - (radius * 0.9), baseY + 0.15, baseZ);
                sector.rotation.z = 0.2;
                group.add(sector);

                const baseCircle = new THREE.Mesh(
                    new THREE.CircleGeometry(radius, 48),
                    new THREE.MeshPhongMaterial({ color: 0xf5e2bc, transparent: true, opacity: 0.86, side: THREE.DoubleSide })
                );
                baseCircle.position.set(baseX + slant * 0.95, baseY - radius * 0.45, baseZ);
                group.add(baseCircle);

                const labelText = (text, xOff, yOff) => {
                    const div = document.createElement('div');
                    div.textContent = text;
                    div.style.background = 'rgba(255,248,230,0.9)';
                    div.style.color = '#2e241a';
                    div.style.fontSize = '14px';
                    div.style.fontWeight = 'bold';
                    div.style.padding = '4px 10px';
                    div.style.borderRadius = '18px';
                    div.style.border = '1px solid rgba(180,111,42,0.75)';
                    const label = new CSS2DObject(div);
                    label.position.set(baseX + xOff, baseY + yOff, baseZ + 0.01);
                    group.add(label);
                };
                labelText('圆锥展开图', 0, slant * 0.65 + 0.55);
                labelText(`侧面: 扇形 r=${slant.toFixed(2)}`, -radius * 0.85, 0.0);
                labelText(`底面: 圆形 r=${radius.toFixed(2)}`, slant * 0.95, -radius * 0.45 - 0.55);
            } else if (type === 'tetrahedron') {
                const side = shapeParams.x;
                const triHeight = Math.sqrt(3) * side / 2;
                const triMat = new THREE.MeshPhongMaterial({ color: 0xeeddae, transparent: true, opacity: 0.82, side: THREE.DoubleSide });
                const triGeo = new THREE.ShapeGeometry(new THREE.Shape([
                    new THREE.Vector2(0, triHeight * 0.62),
                    new THREE.Vector2(-side * 0.5, -triHeight * 0.38),
                    new THREE.Vector2(side * 0.5, -triHeight * 0.38)
                ]));
                const tri1 = new THREE.Mesh(triGeo, triMat);
                tri1.position.set(baseX, baseY + triHeight * 1.15, baseZ);
                group.add(tri1);
                const tri2 = new THREE.Mesh(triGeo.clone(), triMat.clone());
                tri2.position.set(baseX - side * 0.7, baseY - triHeight * 0.1, baseZ);
                tri2.rotation.z = Math.PI / 2;
                group.add(tri2);
                const tri3 = new THREE.Mesh(triGeo.clone(), triMat.clone());
                tri3.position.set(baseX + side * 0.7, baseY - triHeight * 0.1, baseZ);
                tri3.rotation.z = -Math.PI / 2;
                group.add(tri3);
                const tri4 = new THREE.Mesh(triGeo.clone(), triMat.clone());
                tri4.position.set(baseX, baseY - triHeight * 1.45, baseZ);
                tri4.rotation.z = Math.PI;
                group.add(tri4);

                const div = document.createElement('div');
                div.textContent = `正四面体展开图 棱长 ${side.toFixed(2)}`;
                div.style.background = 'rgba(255,248,230,0.9)';
                div.style.color = '#2e241a';
                div.style.fontSize = '14px';
                div.style.fontWeight = 'bold';
                div.style.padding = '4px 10px';
                div.style.borderRadius = '18px';
                div.style.border = '1px solid rgba(165,114,58,0.75)';
                const label = new CSS2DObject(div);
                label.position.set(baseX, baseY + triHeight * 2.0, baseZ + 0.01);
                group.add(label);
            }
            return group;
        }
        
        // 核心刷新: 重建模型并处理展开图
        function rebuildScene() {
            removeCurrent();
            const type = currentShapeType;
            let mesh = null;
            const shapeParams = shapeState[type];
            params = { ...shapeParams };
            if (type === 'cube') {
                const s = shapeParams.x;
                mesh = createBoxMesh(s, s, s, 0x7c96c8);
                updateInfoPanel('cube', s, s, s);
            } else if (type === 'cuboid') {
                mesh = createBoxMesh(shapeParams.x, shapeParams.y, shapeParams.z, 0x7c96c8);
                updateInfoPanel('cuboid', shapeParams.x, shapeParams.y, shapeParams.z);
            } else if (type === 'sphere') {
                mesh = createStandardMesh('sphere', shapeParams);
                updateInfoPanel('sphere', shapeParams.x, 0, 0);
            } else if (type === 'cylinder') {
                mesh = createStandardMesh('cylinder', shapeParams);
                updateInfoPanel('cylinder', shapeParams.x, shapeParams.y, 0);
            } else if (type === 'cone') {
                mesh = createStandardMesh('cone', shapeParams);
                updateInfoPanel('cone', shapeParams.x, shapeParams.y, 0);
            } else if (type === 'tetrahedron') {
                mesh = createStandardMesh('tetrahedron', shapeParams);
                updateInfoPanel('tetrahedron', shapeParams.x, 0, 0);
            }
            if (mesh) {
                mesh.position.set(0, 0, 0);
                solidScene.add(mesh);
                currentMesh = mesh;
                const edgeLines = attachEdges(mesh, 0xffcf8a);
                currentEdges = edgeLines;
            }
            if (netVisible) {
                const netGroup = generateNetGroup(type, params);
                netScene.add(netGroup);
                currentNetGroup = netGroup;
                resizeViewports();
                resetNetCamera();
            }
            const btn = document.getElementById('toggleNetBtn');
            btn.innerText = netVisible ? "📄 隐藏展开图" : "📄 显示展开图";
        }
        
        function refresh() {
            rebuildScene();
            const btn = document.getElementById('toggleNetBtn');
            btn.innerText = netVisible ? "📄 隐藏展开图" : "📄 显示展开图";
            updateControlButtons();
        }
        
        // 事件绑定
        document.getElementById('shapeSelector').addEventListener('change', (e) => {
            currentShapeType = e.target.value;
            updateSliderVisibility(currentShapeType);
            refresh();
        });

        const autoRotateBtn = document.getElementById('toggleAutoRotateBtn');
        const pauseBtn = document.getElementById('togglePauseBtn');
        const closeNetBtn = document.getElementById('closeNetBtn');
        const resetViewBtn = document.getElementById('resetViewBtn');
        const updateControlButtons = () => {
            autoRotateBtn.innerText = autoRotateEnabled ? '🔄 自动旋转：开' : '🔄 自动旋转：关';
            autoRotateBtn.classList.toggle('active', autoRotateEnabled);
            pauseBtn.innerText = autoRotatePaused ? '⏸️ 暂停：开' : '⏸️ 暂停：关';
            pauseBtn.classList.toggle('active', autoRotatePaused);
            controls.autoRotate = autoRotateEnabled && !autoRotatePaused;
        };
        autoRotateBtn.addEventListener('click', () => {
            autoRotateEnabled = !autoRotateEnabled;
            if (!autoRotateEnabled) autoRotatePaused = false;
            updateControlButtons();
        });
        pauseBtn.addEventListener('click', () => {
            if (!autoRotateEnabled) return;
            autoRotatePaused = !autoRotatePaused;
            updateControlButtons();
        });
        closeNetBtn.addEventListener('click', () => {
            netVisible = false;
            updateNetViewportVisibility();
            resizeViewports();
            updateControlButtons();
        });
        resetViewBtn.addEventListener('click', () => {
            solidCamera.position.set(3.2, 2.2, 4.2);
            controls.target.set(0, 0, 0);
            controls.update();
            resetNetCamera();
            if (currentMesh) currentMesh.rotation.set(0, 0, 0);
            if (currentEdges) currentEdges.rotation.set(0, 0, 0);
        });

        netViewportEl.addEventListener('wheel', (event) => {
            if (!netVisible) return;
            event.preventDefault();
            event.stopPropagation();
            netZoom += event.deltaY > 0 ? -0.08 : 0.08;
            netZoom = Math.max(0.5, Math.min(2.5, netZoom));
            netCamera.zoom = netZoom;
            netCamera.updateProjectionMatrix();
        }, { passive: false });

        const sX = document.getElementById('sizeX');
        const sY = document.getElementById('sizeY');
        const sZ = document.getElementById('sizeZ');
        const syncStateFromSliders = () => {
            const state = shapeState[currentShapeType];
            if (currentShapeType === 'cube') {
                state.x = parseFloat(sX.value);
                document.getElementById('sizeXVal').innerText = state.x.toFixed(2);
            } else if (currentShapeType === 'cuboid') {
                state.x = parseFloat(sX.value);
                state.y = parseFloat(sY.value);
                state.z = parseFloat(sZ.value);
                document.getElementById('sizeXVal').innerText = state.x.toFixed(2);
                document.getElementById('sizeYVal').innerText = state.y.toFixed(2);
                document.getElementById('sizeZVal').innerText = state.z.toFixed(2);
            } else if (currentShapeType === 'sphere') {
                state.x = parseFloat(sX.value);
                document.getElementById('sizeXVal').innerText = state.x.toFixed(2);
            } else if (currentShapeType === 'cylinder') {
                state.x = parseFloat(sX.value);
                state.y = parseFloat(sY.value);
                document.getElementById('sizeXVal').innerText = state.x.toFixed(2);
                document.getElementById('sizeYVal').innerText = state.y.toFixed(2);
            } else if (currentShapeType === 'cone') {
                state.x = parseFloat(sX.value);
                state.y = parseFloat(sY.value);
                document.getElementById('sizeXVal').innerText = state.x.toFixed(2);
                document.getElementById('sizeYVal').innerText = state.y.toFixed(2);
            } else if (currentShapeType === 'tetrahedron') {
                state.x = parseFloat(sX.value);
                document.getElementById('sizeXVal').innerText = state.x.toFixed(2);
            }
            params = { ...state };
            refresh();
        };
        sX.addEventListener('input', syncStateFromSliders);
        sY.addEventListener('input', syncStateFromSliders);
        sZ.addEventListener('input', syncStateFromSliders);
        
        document.getElementById('toggleNetBtn').addEventListener('click', () => {
            netVisible = !netVisible;
            updateNetViewportVisibility();
            resizeViewports();
            if (netVisible) resetNetCamera();
            updateControlButtons();
        });

        // 初始化
        currentShapeType = document.getElementById('shapeSelector').value;
        updateSliderVisibility(currentShapeType);
        updateControlButtons();
        refresh();
        resetNetCamera();
        updateNetViewportVisibility();
        resizeViewports();

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            if (autoRotateEnabled && !autoRotatePaused && currentMesh) {
                currentMesh.rotation.y += 0.01;
                if (currentEdges) currentEdges.rotation.y += 0.01;
            }
            controls.update();
            solidRenderer.render(solidScene, solidCamera);
            netRenderer.render(netScene, netCamera);
            labelRenderer.render(netScene, netCamera);
        }
        animate();

        window.addEventListener('resize', () => {
            resizeViewports();
        });
    </script>
